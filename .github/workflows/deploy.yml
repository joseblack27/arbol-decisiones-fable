name: Deploy Godot Server

on:
  push:
    branches: [online]

# Si se pushean dos commits seguidos (ej. dos instrumentaciones cortas
# rápido una de la otra), sin esto podían correr dos workflows en paralelo
# — si el más viejo tardaba más en build-and-push, su deploy por SSH podía
# terminar DESPUÉS que el del commit nuevo y pisarlo, dejando la VM en el
# código viejo aunque el Action del commit nuevo mostrara verde (pasó de
# verdad: 8717a9b nunca llegó a desplegarse, quedó corriendo ca377db).
# cancel-in-progress cancela cualquier corrida vieja de ESTE mismo grupo
# apenas empieza una nueva — nunca hay dos deploys del mismo branch
# compitiendo por quién termina último.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/joseblack27/arbol-decisiones-fable:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/arbol-decisiones-fable
            git fetch origin online
            git reset --hard origin/online
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u joseblack27 --password-stdin
            docker pull ghcr.io/joseblack27/arbol-decisiones-fable:latest
            cd docker
            docker compose -f docker-compose.prod.yml up -d
            # Sin esto, la imagen anterior queda huérfana (sin tag) en cada
            # deploy y se acumula -- el disco de 9.7GB de esta VM se llenó
            # así MÁS DE UNA VEZ (confirmado en vivo, docker image prune
            # liberaba 5GB+ de golpe), rompiendo en silencio git fetch/
            # docker pull del PRÓXIMO deploy (sin espacio para escribir) y
            # dejando el servidor corriendo una imagen vieja pese a que el
            # Action mostrara verde -- exactamente la causa de que el
            # guardado de partidas pareciera "romperse solo" repetidas
            # veces. Sin -a: solo borra imágenes SIN tag (la vieja, recién
            # reemplazada arriba), nunca la que está en uso.
            docker image prune -f
